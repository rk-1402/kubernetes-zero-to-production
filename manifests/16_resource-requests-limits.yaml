# ---8<--- (1) Topic 16 — Resource Requests and Limits ---8<---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
      - name: api
        image: myrepo/api:2.0
        resources:
          requests: { cpu: 250m, memory: 256Mi }
          limits:   { cpu: 1,    memory: 512Mi }

# ---8<--- (2) Topic 16 — Resource Requests and Limits ---8<---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: dev }
spec:
  limits:
  - type: Container
    default:        { cpu: 500m, memory: 256Mi }      # default limit
    defaultRequest: { cpu: 100m, memory: 128Mi }      # default request
    max:            { cpu: 2,    memory: 2Gi }
    min:            { cpu: 50m,  memory: 64Mi }

# ---8<--- (3) Topic 16 — Resource Requests and Limits ---8<---
apiVersion: v1
kind: ResourceQuota
metadata: { name: team-quota, namespace: dev }
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "40"
    persistentvolumeclaims: "10"

# ---8<--- (4) Topic 16 — Resource Requests and Limits ---8<---
# oom.yaml
apiVersion: v1
kind: Pod
metadata: { name: oom }
spec:
  containers:
  - name: stress
    image: polinux/stress
    resources:
      requests: { memory: 50Mi, cpu: 100m }
      limits:   { memory: 100Mi, cpu: 200m }
    command: ["stress","--vm","1","--vm-bytes","250M","--vm-hang","1"]

# ---8<--- (5) Topic 16 — Resource Requests and Limits ---8<---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata: { name: web-vpa }
spec:
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  updatePolicy: { updateMode: "Off" }
