# ---8<--- (1) Topic 43 — Secrets Management Deep Dive (Sealed Secrets, External Secrets, Vault, Workload Identity, IRSA) ---8<---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: gcp-sm }
spec:
  provider:
    gcpsm:
      projectID: my-project
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: db-cred, namespace: prod }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: gcp-sm, kind: ClusterSecretStore }
  target: { name: db-cred }
  data:
  - { secretKey: PASSWORD, remoteRef: { key: prod-db-password } }

# ---8<--- (2) Topic 43 — Secrets Management Deep Dive (Sealed Secrets, External Secrets, Vault, Workload Identity, IRSA) ---8<---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: aws-secrets }
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "prod/api-key"
        objectType: "secretsmanager"
---
apiVersion: v1
kind: Pod
metadata: { name: app-with-csi-secrets, namespace: prod }
spec:
  containers:
  - name: app
    image: myrepo/app:1.0
    volumeMounts: [{ name: secrets, mountPath: /mnt/secrets, readOnly: true }]
  volumes:
  - name: secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes: { secretProviderClass: aws-secrets }
