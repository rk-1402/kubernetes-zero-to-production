# ---8<--- (1) Topic 30 — CSI Drivers (GCE PD, EBS, EFS, Filestore) ---8<---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata: { name: pd-snap }
driver: pd.csi.storage.gke.io
deletionPolicy: Retain
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata: { name: db-snap }
spec:
  volumeSnapshotClassName: pd-snap
  source: { persistentVolumeClaimName: data-db-0 }

# ---8<--- (2) Topic 30 — CSI Drivers (GCE PD, EBS, EFS, Filestore) ---8<---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: db-restored }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 50Gi } }
  storageClassName: standard-rwo
  dataSource:
    kind: VolumeSnapshot
    name: db-snap
    apiGroup: snapshot.storage.k8s.io

# ---8<--- (3) Topic 30 — CSI Drivers (GCE PD, EBS, EFS, Filestore) ---8<---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: shared-data }
spec:
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 5Gi } }
  storageClassName: efs

# ---8<--- (4) Topic 30 — CSI Drivers (GCE PD, EBS, EFS, Filestore) ---8<---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: shared-files }
spec:
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 1Ti } }   # Filestore min 1Ti basic
  storageClassName: standard-rwx
