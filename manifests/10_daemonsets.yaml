# ds.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: ping }
spec:
  selector: { matchLabels: { app: ping } }
  template:
    metadata: { labels: { app: ping } }
    spec:
      tolerations: [{ operator: Exists }]
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh","-c","while true; do echo alive; sleep 30; done"]
