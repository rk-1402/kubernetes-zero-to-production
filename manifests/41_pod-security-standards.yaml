# ---8<--- (1) Topic 41 — Pod Security Standards / Pod Security Admission ---8<---
apiVersion: v1
kind: Pod
metadata: { name: safe, namespace: prod }
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000
    seccompProfile: { type: RuntimeDefault }
  containers:
  - name: app
    image: myrepo/app:1
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
