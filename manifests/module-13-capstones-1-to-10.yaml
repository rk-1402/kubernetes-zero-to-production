# ---8<--- (14) Capstone 6 — StatefulSet PostgreSQL with PVC on GKE Filestore + EKS EBS/EFS, Including Backup and Restore ---8<---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: gp3-sc }
provisioner: ebs.csi.aws.com
parameters: { type: gp3, iops: "3000", throughput: "125" }
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

# ---8<--- (15) Capstone 6 — StatefulSet PostgreSQL with PVC on GKE Filestore + EKS EBS/EFS, Including Backup and Restore ---8<---
apiVersion: batch/v1
kind: CronJob
metadata: { name: pg-backup, namespace: db }
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pg-backup-sa   # IRSA / WLI SA
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: postgres:16
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pg-postgresql, key: postgres-password } }
              command:
                - /bin/sh
                - -c
                - |
                  TS=$(date +%Y%m%d-%H%M)
                  pg_dump -h pg-postgresql -U postgres shopdb | gzip > /tmp/backup-$TS.sql.gz
                  aws s3 cp /tmp/backup-$TS.sql.gz s3://acme-pg-backups/shopdb/backup-$TS.sql.gz

# ---8<--- (16) Capstone 7 — Enforce Security: RBAC + NetworkPolicy + Pod Security Admission + WLI (GKE) + IRSA (EKS) ---8<---
apiVersion: v1
kind: ServiceAccount
metadata: { name: shop-dev, namespace: shop }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: shop-dev, namespace: shop }
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "services", "configmaps"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: shop-dev, namespace: shop }
subjects: [{ kind: User, name: dev@acme.io, apiGroup: rbac.authorization.k8s.io }]
roleRef: { kind: Role, name: shop-dev, apiGroup: rbac.authorization.k8s.io }

# ---8<--- (17) Capstone 7 — Enforce Security: RBAC + NetworkPolicy + Pod Security Admission + WLI (GKE) + IRSA (EKS) ---8<---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: shop }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: shop }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: frontend-to-backend, namespace: shop }
spec:
  podSelector: { matchLabels: { app: backend } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: frontend } } }]
      ports: [{ port: 8080 }]

# ---8<--- (18) Capstone 8 — GitOps Deployment Using ArgoCD on GKE and EKS with Multi-Environment (dev/stage/prod) Sync ---8<---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: shop, namespace: argocd }
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: https://kubernetes.default.svc      # GKE hub
            valuesFile: envs/dev/values.yaml
          - env: stage
            cluster: https://kubernetes.default.svc
            valuesFile: envs/stage/values.yaml
          - env: prod-gke
            cluster: https://kubernetes.default.svc
            valuesFile: envs/prod/values.yaml
          - env: prod-eks
            cluster: https://<eks-endpoint>              # from argocd cluster list
            valuesFile: envs/prod/values.yaml
  template:
    metadata: { name: 'shop-{{env}}' }
    spec:
      project: default
      source:
        repoURL: https://github.com/acme/shop-config
        targetRevision: main
        path: charts/shop
        helm:
          valueFiles: ['../../{{valuesFile}}']
      destination:
        server: '{{cluster}}'
        namespace: 'shop-{{env}}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]

