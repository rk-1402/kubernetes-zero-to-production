# ---8<--- (1) Topic 40 — Service Accounts ---8<---
apiVersion: v1
kind: ServiceAccount
metadata: { name: no-api }
automountServiceAccountToken: false

# ---8<--- (2) Topic 40 — Service Accounts ---8<---
apiVersion: v1
kind: ServiceAccount
metadata: { name: app-sa, namespace: prod }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: app-rb, namespace: prod }
subjects: [{ kind: ServiceAccount, name: app-sa, namespace: prod }]
roleRef: { kind: Role, name: pod-reader, apiGroup: rbac.authorization.k8s.io }

# ---8<--- (3) Topic 40 — Service Accounts ---8<---
apiVersion: v1
kind: ServiceAccount
metadata: { name: no-api }
automountServiceAccountToken: false

# ---8<--- (4) Topic 40 — Service Accounts ---8<---
apiVersion: v1
