# ---8<--- (1) Topic 21 — Ingress and Ingress Controllers ---8<---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [app.example.com]
    secretName: app-tls
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend: { service: { name: api, port: { number: 80 } } }
      - path: /
        pathType: Prefix
        backend: { service: { name: frontend, port: { number: 80 } } }

# ---8<--- (2) Topic 21 — Ingress and Ingress Controllers ---8<---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gke-app
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: app-cert
    kubernetes.io/ingress.global-static-ip-name: app-ip
spec:
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend: { service: { name: web, port: { number: 80 } } }
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata: { name: app-cert }
spec:
  domains: [app.example.com]

# ---8<--- (3) Topic 21 — Ingress and Ingress Controllers ---8<---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:123:certificate/abc
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: web, port: { number: 80 } } }

# ---8<--- (4) Topic 21 — Ingress and Ingress Controllers ---8<---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: letsencrypt-staging }
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef: { name: letsencrypt-staging }
    solvers: [{ http01: { ingress: { class: nginx } } }]
