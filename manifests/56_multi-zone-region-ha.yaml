apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: web }
spec:
  generators:
  - clusters:
      selector: { matchLabels: { env: prod } }
  template:
    spec:
      source: { repoURL: https://github.com/org/k8s-manifests, path: prod }
      destination: { server: '{{server}}', namespace: prod }
