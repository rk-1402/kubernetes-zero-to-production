# ---8<--- (1) Topic 49 — Liveness, Readiness, Startup Probes ---8<---
apiVersion: v1
kind: Pod
metadata: { name: liveness-demo }
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh","-c","touch /tmp/healthy; sleep 30; rm /tmp/healthy; sleep 600"]
    livenessProbe:
      exec: { command: ["cat","/tmp/healthy"] }
      periodSeconds: 5
      failureThreshold: 3
