# pod-order.yaml
apiVersion: v1
kind: Pod
metadata: { name: order-demo, labels: { app: order } }
spec:
  initContainers:
  - name: init-a
    image: busybox:1.36
    command: ['sh','-c','echo init-a; sleep 3']
  - name: sidecar-log
    image: busybox:1.36
    restartPolicy: Always
    command: ['sh','-c','while true; do echo sidecar $(date); sleep 5; done']
  containers:
  - name: app
    image: nginx:1.27
    readinessProbe:
      httpGet: { path: /, port: 80 }
      periodSeconds: 3

# ---8<--- (5) Topic 6 — Pods ---8<---
apiVersion: v1
kind: Pod
metadata: { name: hungry }
spec:
  containers:
  - name: mem
    image: polinux/stress
    resources:
      requests: { memory: "50Mi", cpu: "100m" }
      limits:   { memory: "100Mi", cpu: "200m" }
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]

