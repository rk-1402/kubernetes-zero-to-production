# ---8<--- (1) Topic 6 — Pods ---8<---
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels: { app: web }
spec:
  initContainers:
  - name: wait-for-db
    image: busybox:1.36
    command: ['sh', '-c', 'until nc -z db 5432; do sleep 2; done']
  - name: log-shipper       # native sidecar (K8s 1.29+)
    image: fluent/fluent-bit:3
    restartPolicy: Always
    volumeMounts:
    - { name: applogs, mountPath: /var/log/app }
  containers:
  - name: app
    image: nginx:1.27
    ports: [{ containerPort: 80 }]
    livenessProbe:
      httpGet: { path: /, port: 80 }
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /, port: 80 }
      periodSeconds: 5
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    volumeMounts:
    - { name: applogs, mountPath: /var/log/nginx }
  volumes:
  - name: applogs
    emptyDir: {}
  terminationGracePeriodSeconds: 30

# ---8<--- (2) Topic 6 — Pods ---8<---
apiVersion: v1
kind: Pod
metadata: { name: hardened }
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000
    seccompProfile: { type: RuntimeDefault }
  containers:
  - name: app
    image: gcr.io/distroless/static:nonroot
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    lifecycle:
      postStart:
        exec: { command: ["/bin/warmup"] }
      preStop:
        exec: { command: ["/bin/drain", "--wait=10s"] }

