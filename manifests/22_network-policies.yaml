# ---8<--- (1) Topic 22 — Network Policies ---8<---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-all-ingress, namespace: prod }
spec:
  podSelector: {}
  policyTypes: [Ingress]

# ---8<--- (2) Topic 22 — Network Policies ---8<---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-all-egress, namespace: prod }
spec:
  podSelector: {}
  policyTypes: [Egress]

# ---8<--- (3) Topic 22 — Network Policies ---8<---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-api-db, namespace: prod }
spec:
  podSelector: { matchLabels: { app: db } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: api } }
    ports: [{ protocol: TCP, port: 5432 }]

# ---8<--- (4) Topic 22 — Network Policies ---8<---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: prod }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to: []                          # any destination
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }

# ---8<--- (5) Topic 22 — Network Policies ---8<---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-frontend, namespace: prod }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { name: frontend } }
      podSelector: { matchLabels: { app: web } }
    ports: [{ port: 8080 }]
