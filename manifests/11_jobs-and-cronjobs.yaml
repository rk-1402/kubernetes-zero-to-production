# ---8<--- (1) Topic 11 — Jobs and CronJobs ---8<---
apiVersion: batch/v1
kind: Job
metadata: { name: db-migrate }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mig
        image: myrepo/migrate:1.4.2
        command: ["migrate", "-database", "$(DB_URL)", "up"]
        envFrom: [{ secretRef: { name: db-url } }]

# ---8<--- (2) Topic 11 — Jobs and CronJobs ---8<---
apiVersion: batch/v1
kind: Job
metadata: { name: infer }
spec:
  completions: 20
  parallelism: 5
  completionMode: Indexed
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: myrepo/inference:2.1
        env:
        - name: SHARD
          valueFrom: { fieldRef: { fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']" } }
        command: ["python","run.py","--shard","$(SHARD)","--of","20"]

# ---8<--- (3) Topic 11 — Jobs and CronJobs ---8<---
apiVersion: batch/v1
kind: CronJob
metadata: { name: nightly-backup }
spec:
  schedule: "0 2 * * *"            # 2 AM
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: dump
            image: myrepo/pg-backup:1.0
            envFrom: [{ secretRef: { name: pg-secret } }]
            command: ["/usr/local/bin/backup.sh"]

# ---8<--- (4) Topic 11 — Jobs and CronJobs ---8<---
apiVersion: batch/v1
kind: Job
metadata: { name: worker }
spec:
  completions: 1
  parallelism: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: w
        image: myrepo/queue-worker:1
        env: [{ name: REDIS, value: redis-master.default.svc:6379 }]
