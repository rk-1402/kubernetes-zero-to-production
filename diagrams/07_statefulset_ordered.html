<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/><title>StatefulSet: Ordered Pods + Per-Pod Storage</title>
<style>
:root{--blue:#2563eb;--green:#059669;--teal:#0e7490;--purple:#7c3aed;--amber:#d97706;--red:#dc2626;--ink:#0f172a;--mut:#64748b;--line:#cbd5e1;--bg:#f8fafc;--card:#fff;}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 44px;}
h1{font-size:20px;margin:0 0 2px;color:#1e3a8a;}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px;}
.sub code,.cap code{background:#eef2ff;color:#3730a3;padding:1px 5px;border-radius:4px;font-family:Menlo,Consolas,monospace;}
.stage-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
svg{width:100%;height:auto;display:block}
.box{fill:#fff;stroke:var(--line);stroke-width:2;transition:all .5s ease;}
.box.hot{stroke:var(--blue);stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(37,99,235,.35));}
.box.ok{stroke:var(--green);stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(5,150,105,.3));}
.box.warn{stroke:var(--amber);stroke-width:3.5;}
.box.deny{stroke:var(--red);stroke-width:3.5;}
.lbl{font:600 14px 'Segoe UI';fill:var(--ink);}
.sublbl{font:11px 'Segoe UI';fill:var(--mut);}
.band{fill:#f1f5f9;stroke:#e2e8f0;}
.bandlbl{font:700 11px 'Segoe UI';fill:#475569;letter-spacing:.5px;}
.flow{stroke:var(--line);stroke-width:2.5;fill:none;marker-end:url(#arh);}
.flow.live{stroke:var(--blue);stroke-dasharray:7 6;animation:dash 1s linear infinite;}
.flow.ok{stroke:var(--green);stroke-dasharray:7 6;animation:dash 1s linear infinite;marker-end:url(#arhg);}
.flow.deny{stroke:var(--red);stroke-dasharray:2 5;}
@keyframes dash{to{stroke-dashoffset:-26}}
.dyn{opacity:0;transition:all .55s ease;} .dyn.show{opacity:1;}
.pod{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2;transform-box:fill-box;transform-origin:center;}
.pod.run{fill:#bbf7d0;stroke:var(--green);} .pod.warn{fill:#fde68a;stroke:var(--amber);} .pod.deny{fill:#fecaca;stroke:var(--red);}
.pod.pulse{animation:pp 1.4s ease-in-out infinite;}
@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.lamp{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5;} .lamp.ok{fill:#22c55e;stroke:#16a34a;} .lamp.warn{fill:#f59e0b;stroke:#d97706;} .lamp.bad{fill:#ef4444;stroke:#dc2626;}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px;}
button{font:600 13px 'Segoe UI';border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue);} button:hover{filter:brightness(.97)}
.stepn{color:var(--mut);font-size:13px;margin-left:auto;}
.cap{background:#eff6ff;border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;font-size:14px;min-height:46px;}
.cap b{color:#1e3a8a;}
.foot{color:var(--mut);font-size:12px;margin-top:12px;}
</style></head><body><div class="wrap">
<h1>StatefulSet: Ordered Pods + Per-Pod Storage</h1><div class="sub">Topic 9 &amp; 31 · stable names, stable DNS, one PVC per pod, ordered lifecycle</div>
<div class="stage-card">
<svg id="stage" viewBox="0 0 900 445" data-step="0">
<defs>
<marker id="arh" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
<marker id="arhg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#059669"/></marker>
</defs>

<g id="bhs"><rect class="box" x="350" y="20" width="200" height="50" rx="10"/><text x="450.0" y="39.0" text-anchor="middle" class="lbl">Headless Service</text><text x="450.0" y="57.0" text-anchor="middle" class="sublbl">clusterIP: None</text></g>
<rect class="band" x="20" y="95" width="860" height="330" rx="14"/><text x="34" y="117" class="bandlbl">StatefulSet  db  (ordered)</text>
<g id="pg0"><rect class="box" x="70" y="150" width="180" height="64" rx="10"/><text x="160.0" y="176.0" text-anchor="middle" class="lbl">db-0</text><text x="160.0" y="194.0" text-anchor="middle" class="sublbl">stable DNS db-0.db</text></g>
<g id="pg1"><rect class="box" x="70" y="240" width="180" height="64" rx="10"/><text x="160.0" y="266.0" text-anchor="middle" class="lbl">db-1</text><text x="160.0" y="284.0" text-anchor="middle" class="sublbl">db-1.db</text></g>
<g id="pg2"><rect class="box" x="70" y="330" width="180" height="64" rx="10"/><text x="160.0" y="356.0" text-anchor="middle" class="lbl">db-2</text><text x="160.0" y="374.0" text-anchor="middle" class="sublbl">db-2.db</text></g>
<rect id="pv0" class="dyn" x="320" y="158" width="180" height="48" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" style="opacity:0"/>
<text id="pv0t" class="dyn sublbl" x="410" y="187" text-anchor="middle" style="opacity:0">PVC data-db-0</text>
<rect id="pv1" class="dyn" x="320" y="248" width="180" height="48" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" style="opacity:0"/>
<text id="pv1t" class="dyn sublbl" x="410" y="277" text-anchor="middle" style="opacity:0">PVC data-db-1</text>
<rect id="pv2" class="dyn" x="320" y="338" width="180" height="48" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" style="opacity:0"/>
<text id="pv2t" class="dyn sublbl" x="410" y="367" text-anchor="middle" style="opacity:0">PVC data-db-2</text>
<path class="flow" d="M450 70 V96"/>

</svg></div>
<div class="controls">
<button id="prev">&#8249; Prev</button><button id="next">Next &#8250;</button>
<span class="stepn" id="stepn"></span></div>
<div class="cap" id="cap"></div>
<div class="foot">Deleting &amp; recreating db-1 re-binds the <b>same</b> PVC — identity and data survive rescheduling.</div>
</div>
<script>
const S=document.getElementById('stage'),cap=document.getElementById('cap'),stepn=document.getElementById('stepn');
const STEPS=[
  {"cap": "<b>Ordered creation.</b> A StatefulSet creates pods one at a time. <b>db-0</b> starts first and must become Ready before the next.", "hot": ["pg0"], "cls": [["pg0", "hot"]]},
  {"cap": "<b>db-0 gets its own disk.</b> The <code>volumeClaimTemplate</code> provisions <b>data-db-0</b>, bound to db-0 forever \u2014 stable identity + stable storage.", "ok": ["pg0"], "on": ["pv0", "pv0t"], "cls": [["pg0", "run"]]},
  {"cap": "<b>db-1 next,</b> only after db-0 is Ready \u2014 with its own <b>data-db-1</b>.", "ok": ["pg0"], "on": ["pv0", "pv0t", "pv1", "pv1t"], "cls": [["pg0", "run"], ["pg1", "hot"]]},
  {"cap": "<b>db-2 last.</b> Each pod has a predictable name, DNS record, and dedicated volume \u2014 exactly what databases need.", "ok": ["pg0", "pg1"], "on": ["pv0", "pv0t", "pv1", "pv1t", "pv2", "pv2t"], "cls": [["pg0", "run"], ["pg1", "run"], ["pg2", "hot"]]},
  {"cap": "<b>Delete db-1.</b> Its pod is removed\u2026", "ok": ["pg0", "pg2"], "on": ["pv0", "pv0t", "pv1", "pv1t", "pv2", "pv2t"], "cls": [["pg0", "run"], ["pg2", "run"], ["pg1", "deny"]]},
  {"cap": "<b>\u2026and comes back as db-1</b> \u2014 same name, same DNS, <b>re-attached to data-db-1</b>. No data lost. That's the StatefulSet guarantee.", "ok": ["pg0", "pg1", "pg2"], "on": ["pv0", "pv0t", "pv1", "pv1t", "pv2", "pv2t"], "cls": [["pg0", "run"], ["pg1", "run"], ["pg2", "run"]]}
];
let i=0,timer=null;
function setStep(n){
  i=(n+STEPS.length)%STEPS.length;const st=STEPS[i];S.setAttribute('data-step',i);
  document.querySelectorAll('.box').forEach(b=>b.classList.remove('hot','ok','warn','deny'));
  document.querySelectorAll('.flow').forEach(f=>f.classList.remove('live','ok','deny'));
  document.querySelectorAll('.dyn').forEach(d=>d.classList.remove('show','run','pulse','warn','deny','ok'));
  document.querySelectorAll('.lamp').forEach(l=>l.classList.remove('ok','warn','bad'));
  (st.hot||[]).forEach(id=>{const b=document.querySelector('#'+id+' .box'); if(b)b.classList.add('hot');});
  (st.ok||[]).forEach(id=>{const b=document.querySelector('#'+id+' .box'); if(b)b.classList.add('ok');});
  (st.warn||[]).forEach(id=>{const b=document.querySelector('#'+id+' .box'); if(b)b.classList.add('warn');});
  (st.deny||[]).forEach(id=>{const b=document.querySelector('#'+id+' .box'); if(b)b.classList.add('deny');});
  (st.flows||[]).forEach(f=>{const e=document.getElementById(f); if(e)e.classList.add('live');});
  (st.flowsok||[]).forEach(f=>{const e=document.getElementById(f); if(e)e.classList.add('ok');});
  (st.flowsdeny||[]).forEach(f=>{const e=document.getElementById(f); if(e)e.classList.add('deny');});
  (st.on||[]).forEach(id=>{const e=document.getElementById(id); if(e)e.classList.add('show');});
  (st.cls||[]).forEach(a=>{const e=document.getElementById(a[0]); if(e)e.classList.add(a[1]);});
  cap.innerHTML=st.cap;stepn.textContent='Step '+i+' / '+(STEPS.length-1);
}
const DELAY=2000;
function loopTimer(){clearInterval(timer);timer=setInterval(()=>setStep(i+1),DELAY);}
document.getElementById('next').onclick=()=>{setStep(i+1);loopTimer();};
document.getElementById('prev').onclick=()=>{setStep(i-1);loopTimer();};
setStep(0);loopTimer();
</script></body></html>
